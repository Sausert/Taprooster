name: Dagelijkse reminders

on:
  schedule:
    - cron: "0 7 * * *"   # elke dag om 07:00 UTC (08:00 / 09:00 NL)
  workflow_dispatch:        # ook handmatig te starten via GitHub

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Roep reminder endpoint aan
        run: |
          response=$(curl -s -o body.txt -w "%{http_code}" --location-trusted \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://remigommans.nl/api/cron/reminders)
          echo "HTTP status: $response"
          echo "Response body: $(cat body.txt)"
          if [ "$response" != "200" ]; then
            echo "Fout: endpoint gaf status $response terug"
            exit 1
          fi
