name: Dagelijkse reminders

on:
  schedule:
    - cron: "0 7 * * *"   # elke dag om 07:00 UTC (08:00 / 09:00 NL)
  workflow_dispatch:        # ook handmatig te starten via GitHub

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Roep reminder endpoint aan
        run: |
          body=$(curl -s -L \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://remigommans.nl/api/cron/reminders)
          status=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://remigommans.nl/api/cron/reminders)
          echo "HTTP status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "Fout: endpoint gaf status $status terug"
            exit 1
          fi
